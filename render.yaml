databases:
  - name: ct388-db
    plan: basic-256mb
    databaseName: ct388
    user: ct388

services:
  - type: web
    name: ct388-app
    runtime: python
    plan: starter
    rootDir: ThuVienSo_CTGDMN_Local/resources
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ct388-db
          property: connectionString
      - key: CT388_AUTH_SECRET
        generateValue: true
      - key: CT388_ANTHROPIC_API_KEY
        sync: false
